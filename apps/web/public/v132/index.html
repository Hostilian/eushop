<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EUshop V132 — Enterprise Logistics & Tax Gateway</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #090d16; color: #f8fafc; margin: 0; padding: 2rem; }
    h1 { font-size: 2.5rem; color: #a855f7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .card { background: #131b2e; border: 1px solid #2e1065; border-radius: 12px; padding: 1.5rem; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    .btn { background: #9333ea; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #7e22ce; }
  </style>
</head>
<body>
  <h1>🇪🇺 EUshop V132</h1>
  <p>Enterprise Multi-Tenant EU Logistics & Real-time Tax Gateway</p>

  <div class="grid" id="grid"></div>

  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('grid');
    EUSHOP_V132_DATA.products.forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" alt="${p.name}" />
          <h3>${p.name}</h3>
          <p>${p.country} — ${p.origin}</p>
          <p><strong>€${p.price.toFixed(2)}</strong></p>
          <button class="btn">Calculate Shipping & Tax</button>
        </div>
      `;
    });
  </script>
</body>
</html>
