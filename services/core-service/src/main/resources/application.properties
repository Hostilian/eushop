spring.application.name=eushop-core-service
spring.profiles.active=dev

# Server
server.port=3001

# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eushop_db}
spring.datasource.username=${POSTGRES_USER:eushop_dev}
spring.datasource.password=${POSTGRES_PASSWORD:dev_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.eushop=DEBUG
