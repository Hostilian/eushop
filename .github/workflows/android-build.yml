name: Build Android (Expo EAS)

on:
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK (preview)
        if: ${{ github.event.inputs.profile != 'production' }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set — skipping EAS cloud build."
            echo "To build locally: cd apps/mobile && eas build --platform android --profile preview --local"
          else
            eas build --platform android --profile preview --non-interactive
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB (production)
        if: ${{ github.event.inputs.profile == 'production' }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set — skipping EAS cloud build."
          else
            eas build --platform android --profile production --non-interactive
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
