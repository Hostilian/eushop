name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: production
  STAGING_NAMESPACE: staging

jobs:
  # CI STAGES - Run on every push and PR
  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: TypeScript type checking
        run: npm run type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      docker_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD STAGES - Only run on main/develop branches after successful CI
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl for staging
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Deploy to Kubernetes staging
        env:
          KUBE_CONFIG_DATA: ${{ secrets.STAGING_KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Deploy using Kustomize or Helm
          kubectl apply -f k8s/overlays/staging/ -n ${{ env.STAGING_NAMESPACE }}
          
          # Wait for rollout
          kubectl rollout status deployment/app-deployment -n ${{ env.STAGING_NAMESPACE }} --timeout=300s
      
      - name: Run smoke tests
        run: |
          # Execute API smoke tests against staging
          npm run smoke-tests -- --base-url=${{ vars.STAGING_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure kubectl for production
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Deploy with blue-green strategy
        env:
          KUBE_CONFIG_DATA: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Blue-green deployment using kubectl
          # 1. Deploy new version (green)
          kubectl apply -f k8s/overlays/production/ -n ${{ env.K8S_NAMESPACE }}
          
          # 2. Wait for green to be ready
          kubectl rollout status deployment/app-deployment-green -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          
          # 3. Switch traffic (update service selector)
          kubectl patch service app-service -n ${{ env.K8S_NAMESPACE }} -p '{"spec":{"selector":{"version":"green"}}}'
          
          # 4. Monitor health for 2 minutes
          sleep 120
          
          # 5. Run automated health checks
          curl -f ${{ vars.PRODUCTION_URL }}/health || (echo "Health check failed - initiating rollback" && exit 1)
      
      - name: Post-deployment verification
        run: |
          # Run canary tests
          npm run e2e-tests -- --base-url=${{ vars.PRODUCTION_URL }}
          
          # Check metrics for anomalies
          curl -s ${{ vars.PRODUCTION_URL }}/metrics | grep -q 'http_requests_error_rate.*0.01' || (echo "Error rate too high" && exit 1)
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "${{ secrets.PRODUCTION_KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Switch back to blue version
          kubectl patch service app-service -n ${{ env.K8S_NAMESPACE }} -p '{"spec":{"selector":{"version":"blue"}}}'
          
          # Send alert
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"Production deployment failed - rolled back to previous version"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy-production.result || needs.deploy-staging.result || 'success' }}
          author_name: CI/CD Pipeline
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
