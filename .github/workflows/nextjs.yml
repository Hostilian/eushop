# Deploy EUshop Next.js site to GitHub Pages
# Live URL: https://hostilian.github.io/eushop
#
# 5 Versions served from a single build via client-side localStorage version switching:
#   V1 — Pitch & ARR Calculator  (/?v=v1)
#   V2 — Buyer Marketplace       (/?v=v2)
#   V3 — Seller Compliance Hub   (/become-seller/?v=v3)
#   V4 — Admin Console           (/admin/dashboard/?v=v4)
#   V5 — Developer Portal & Docs (/docs/?v=v5)
#
# Version Portal: https://hostilian.github.io/eushop/versions/
#
name: Deploy EUshop to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Note: do NOT use cache: "pnpm" here — it requires packageManager field in package.json
          # We handle caching explicitly with actions/cache below

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install all dependencies
        run: pnpm install --prefer-frozen-lockfile

      - name: Build Next.js static export
        # basePath='/eushop' (default in next.config.js) matches GitHub Pages URL
        # NEXT_PUBLIC_BASE_PATH is intentionally NOT set — defaults to '/eushop'
        run: pnpm --filter "@eushop/web" run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The static export is output to apps/web/out/
          path: ./apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
