# Deploy EUshop to GitHub Pages
# Live URL: https://hostilian.github.io/eushop
#
# Architecture: Next.js static export + static HTML demo folders
#
# Next.js app versions (client-side localStorage version switching via ?v= param):
#   V1 — Pitch & ARR Calculator         (/?v=v1)
#   V2 — Buyer Marketplace              (/?v=v2)
#   V3 — Seller Compliance Hub          (/become-seller/?v=v3)
#   V4 — Admin Console                  (/admin/dashboard/?v=v4)
#   V5 — Developer Portal & Docs        (/docs/?v=v5)
#
# Static folder demos (apps/web/public/vN/ → copied to out/vN/ by Next.js):
#   V3   — Seller Hub static demo       (/eushop/v3/)
#   V6   — Dark Slate theme             (/eushop/v6/)
#   V7   — Ocean Blue theme             (/eushop/v7/)
#   V8   — Emerald Forest theme         (/eushop/v8/)
#   V9   — Crimson Rose theme           (/eushop/v9/)
#   V10  — Midnight Purple theme        (/eushop/v10/)
#   V11  — Golden Amber theme           (/eushop/v11/)
#   V12  — Terracotta Warm theme        (/eushop/v12/)
#   V13  — Lavender Field theme         (/eushop/v13/)
#   V18  — MarketEU (eBay-inspired)     (/eushop/v18/)
#   V19  — ShopNow EU (Amazon-inspired) (/eushop/v19/)
#
# Version Portal: https://hostilian.github.io/eushop/versions/

name: Deploy EUshop to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js static export
        # basePath='/eushop' (set in next.config.js) matches GitHub Pages URL.
        # Next.js copies everything from apps/web/public/ into apps/web/out/ automatically.
        # This means all vN/ static demo folders land in out/vN/ without any extra step.
        run: pnpm --filter "@eushop/web" run build
        env:
          NODE_ENV: production

      - name: Verify static output integrity
        # This step catches silent build failures where out/ is missing or incomplete.
        # It fails loudly rather than uploading an empty/broken artifact.
        run: |
          set -e
          echo "── Checking out/ exists ──────────────────────────────────────"
          if [ ! -d "apps/web/out" ]; then
            echo "❌ FATAL: apps/web/out/ directory not found. Build must have failed."
            exit 1
          fi

          echo "── Checking versions portal ──────────────────────────────────"
          if [ ! -f "apps/web/out/versions/index.html" ]; then
            echo "❌ FATAL: out/versions/index.html missing. Static demos will 404."
            exit 1
          fi

          echo "── Checking key static demo folders ──────────────────────────"
          MISSING=""
          for v in v3 v6 v7 v8 v9 v10 v11 v12 v13 v14 v15 v16 v17 v18 v19 v121 v122 v132 v177; do
            if [ ! -f "apps/web/out/${v}/index.html" ]; then
              echo "⚠️  WARNING: out/${v}/index.html missing"
              MISSING="${MISSING} ${v}"
            else
              echo "✓  out/${v}/index.html"
            fi
          done

          echo "── Checking Next.js app root ──────────────────────────────────"
          if [ ! -f "apps/web/out/index.html" ]; then
            echo "❌ FATAL: out/index.html missing. Next.js build may have failed."
            exit 1
          fi

          echo "── Directory listing (top level) ─────────────────────────────"
          ls -la apps/web/out/

          if [ -n "${MISSING}" ]; then
            echo ""
            echo "⚠️  Some static demo folders were not found in out/:${MISSING}"
            echo "   These will 404 on GitHub Pages. Check that public/vN/ exists."
            # Non-fatal: warn but don't block deploy for missing optional demos
          fi

          echo ""
          echo "✅ Build output verified — proceeding to upload"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js static export output directory
          path: ./apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
