name: ci-cd
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @eushop/web run lint
        continue-on-error: true

      - name: Run web tests
        run: pnpm --filter @eushop/web run test --passWithNoTests
        continue-on-error: true

      - name: Build static export
        working-directory: apps/web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /eushop
          NEXT_PUBLIC_API_URL: https://eushop-api.fly.dev/api
        run: pnpm run build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/out
          publish_branch: gh-pages
          force_orphan: false