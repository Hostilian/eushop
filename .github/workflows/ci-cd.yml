      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter "@eushop/web" run lint
      - name: Type-check web application
        run: pnpm --filter "@eushop/web" exec tsc --noEmit

  # ─── 2. Compliance Engine Tests (HIGHEST PRIORITY — must not be skipped) ──
  compliance-tests:
    name: Compliance Engine Tests
    runs-on: ubuntu-latest
    # COMPLIANCE-REVIEW: These tests are the most important in the repo.
    # A silently-failing VAT calculation or wrong DAC7 threshold is worse
    # than a visibly broken page. Never set continue-on-error: true here.
    steps:
