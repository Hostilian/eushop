name: CI — Lint, Test & Backend Checks
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  web-ci:
    name: Web — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @eushop/web run lint
        continue-on-error: true

      - name: Run web tests
        run: pnpm --filter @eushop/web run test --passWithNoTests
        continue-on-error: true

      - name: Type check
        run: pnpm --filter @eushop/web run type-check
        continue-on-error: true

  backend-ci:
    name: Java Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build & test core-service
        working-directory: services/core-service
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
        continue-on-error: true