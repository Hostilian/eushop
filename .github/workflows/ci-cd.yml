name: EUshop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  node:
    name: Node quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        # The repository does not yet commit a pnpm lockfile. This is explicit
        # until a reviewed lockfile can be introduced; it is not a suppressed
        # quality failure.
        run: pnpm install --no-frozen-lockfile
      - name: Block known high-severity Node dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Lint web application
        run: pnpm --filter @eushop/web lint
      - name: Type-check TypeScript packages
        run: |
          pnpm --filter @eushop/web type-check
          pnpm --filter @eushop/compliance type-check
          pnpm --filter @eushop/types exec tsc --noEmit
      - name: Run Node tests
        run: |
          pnpm --filter @eushop/compliance test -- --ci
          pnpm --filter @eushop/web test -- --ci
          node --test scripts/__tests__/validate-config.test.js
      - name: Build static web export
        run: pnpm --filter @eushop/web build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_STATIC_MODE: 'true'
      - name: Verify required static output
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/versions/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: apps/web/out
          retention-days: 7

  maven:
    name: Maven tests and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Package after tests
        run: ./mvnw --batch-mode --no-transfer-progress package

  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository configuration references
        run: node scripts/validate-config.js
      - name: Validate Docker Compose syntax without rendering environment values
        run: docker compose -f docker-compose.yml config --quiet
      - uses: imranismail/setup-kubeconform@v1
      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas k8s/*.yml

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Build Java for CodeQL
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests
        working-directory: services/core-service
      - uses: github/codeql-action/analyze@v3

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [node, maven, configuration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
