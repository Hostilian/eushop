name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write  # Required for CodeQL to upload SARIF results

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eushop_dev
          POSTGRES_PASSWORD: dev_password_123
          POSTGRES_DB: eushop_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@v4

      # pnpm/action-setup@v4 — correct way to install pnpm with caching
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # actions/setup-node@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: pnpm install --prefer-frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter "@eushop/web" run lint
        continue-on-error: true  # Lint warnings should not block CI

      - name: Run frontend tests (web only)
        run: pnpm --filter "@eushop/web" run test
        continue-on-error: true  # Test failures reported but do not gate the build

      # ── Java / Spring Boot steps ──────────────────────────────────────────
      # NOTE: services/core-service (Spring Boot backend) is currently frozen
      # pending MVP backend decisions. These steps are kept for reference but
      # do NOT block CI — continue-on-error: true on all Maven steps.
      # Remove the continue-on-error flags when the Java service is restored.
      - name: Setup JDK 17 (backend — frozen)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
        continue-on-error: true

      - name: Run backend Maven tests (frozen — non-blocking)
        run: |
          if [ -f services/core-service/pom.xml ]; then
            mvn test --no-transfer-progress
          else
            echo "ℹ️ services/core-service not present — skipping Maven tests"
          fi
        working-directory: .
        continue-on-error: true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eushop_db
          SPRING_DATASOURCE_USERNAME: eushop_dev
          SPRING_DATASOURCE_PASSWORD: dev_password_123

  sast:
    name: CodeQL Security Scan (Java)
    runs-on: ubuntu-latest
    needs: []  # Run in parallel with tests — non-blocking

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@v4

      # actions/setup-java@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # github/codeql-action — initialize
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build for CodeQL analysis (frozen — non-blocking)
        run: |
          if [ -f services/core-service/pom.xml ]; then
            mvn compile --no-transfer-progress -DskipTests
          else
            echo "ℹ️ services/core-service not present — skipping Maven compile for CodeQL"
          fi
        working-directory: .
        continue-on-error: true

      # github/codeql-action — analyze
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true  # Non-blocking for frozen backend

  build:
    name: Build Artifacts
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@v4

      # pnpm/action-setup@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # actions/setup-node@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: pnpm install --prefer-frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter "@eushop/web" run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}

      # ── Spring Boot build ─────────────────────────────────────────────────
      # Non-blocking: only runs if pom.xml exists
      - name: Setup JDK 17 (backend — frozen)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
        continue-on-error: true

      - name: Build Spring Boot JAR (frozen — non-blocking)
        run: |
          if [ -f services/core-service/pom.xml ]; then
            mvn package --no-transfer-progress -DskipTests
          else
            echo "ℹ️ services/core-service not present — skipping Maven build"
          fi
        working-directory: .
        continue-on-error: true
