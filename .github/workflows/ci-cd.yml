# EUshop — Enhanced CI/CD Pipeline
# Phases: lint → unit (compliance first) → build → accessibility → security → deploy
#
# Key additions over the base nextjs.yml:
#   - Compliance engine unit tests (DAC7 edge cases, VAT rates, allergen integrity)
#   - Lighthouse CI with performance budgets
#   - axe-core accessibility scan (floor, not substitute for manual testing)
#   - Snyk dependency vulnerability scan
#   - Preview deployments on PRs (Vercel-style via GitHub Pages preview)
#   - COMPLIANCE-REVIEW: Failing compliance tests must block merge, not just warn.

name: EUshop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: read
  security-events: write  # Required for CodeQL to upload SARIF results

jobs:
