  # ─── 4. Build ─────────────────────────────────────────────────────────────
  core-service-tests:
    name: Core-service Maven Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run core-service tests
        working-directory: services/core-service
        run: |
          chmod +x ./mvnw
          ./mvnw test

  build:
    name: Build Static Export
    runs-on: ubuntu-latest
    needs: [compliance-tests, web-tests, core-service-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - run: pnpm install --prefer-frozen-lockfile
      - name: Build
        run: pnpm --filter "@eushop/web" run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_STATIC_MODE: 'true'
      - name: Verify output
        run: |
          set -e
          [ -d "apps/web/out" ] || (echo "❌ out/ missing" && exit 1)
          [ -f "apps/web/out/index.html" ] || (echo "❌ index.html missing" && exit 1)
          echo "✅ Build output verified"
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: apps/web/out/
          retention-days: 7

  # ─── 5. Accessibility Scan (axe-core — floor, not ceiling) ───────────────
  accessibility:
    name: Accessibility Scan (axe-core)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --prefer-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: apps/web/out/
      - name: Serve static export
        run: npx serve apps/web/out -p 3000 &
      - name: Wait for server
        run: sleep 3
      - name: Run axe-core accessibility scan
        # COMPLIANCE-REVIEW: axe-core catches ~30-50% of real WCAG issues.
        # Manual VoiceOver + TalkBack testing is required before launch (Phase 3.3).
        # Critical paths to test manually: checkout flow, allergen filters, search.
        run: |
          npx @axe-core/cli http://localhost:3000 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --exit \
            --reporter json \
            --output-file axe-results.json || true
          cat axe-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-results
          path: axe-results.json

  # ─── 6. Lighthouse CI (performance budgets) ───────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --prefer-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: apps/web/out/
      - name: Serve static export
        run: npx serve apps/web/out -p 3000 &
      - name: Wait for server
        run: sleep 3
      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli@0.14.x autorun \
            --collect.url=http://localhost:3000 \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=["warn",{"minScore":0.8}] \
            --assert.assertions.categories:accessibility=["error",{"minScore":0.9}] \
            --assert.assertions.categories:best-practices=["warn",{"minScore":0.9}] \
            --assert.assertions.categories:seo=["warn",{"minScore":0.8}] \
            --upload.target=temporary-public-storage || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/

  # ─── 7. Security — Dependency Scan ────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --prefer-frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high || true
      - name: Check for secrets in code
        # Fail if any .env files with real values are accidentally committed
        run: |
          if grep -r "sk_live_\|pk_live_\|STRIPE_SECRET\|AUTH0_CLIENT_SECRET" --include="*.ts" --include="*.tsx" --include="*.js" .; then
            echo "❌ FATAL: Potential secret found in source code"
            exit 1
          fi
          echo "✅ No secrets detected in source files"

  # ─── 8. CodeQL (Java backend) ─────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Spring Boot
        run: cd services/core-service && ./mvnw.cmd package -DskipTests || ./mvnw package -DskipTests
        continue-on-error: true
      - uses: github/codeql-action/analyze@v3

  # ─── 9. Deploy (main branch only) ─────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, compliance-tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: ./out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
