name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eushop_dev
          POSTGRES_PASSWORD: dev_password_123
          POSTGRES_DB: eushop_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # actions/checkout@v4.1.7
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      
      # actions/setup-node@v4.0.3
      - name: Setup Node.js
        uses: actions/setup-node@6012dfb466de543a19a3538f5e09e41c0ad3cf09
        with:
          node-version: '20'
          cache: 'pnpm'

      # actions/setup-java@v4.2.1
      - name: Setup JDK 17
        uses: actions/setup-java@3a4f611cd72b75a7fcd4e29002d242447d1b2299
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run linter
        run: pnpm lint
        
      - name: Run frontend tests
        run: pnpm --filter apps/web --filter apps/mobile run test
        # DATABASE_URL removed as it's not typically needed for frontend tests
      
      - name: Run backend Maven tests
        run: mvn test
        working-directory: services/core-service

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      # actions/checkout@v4.1.7
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      
      # actions/setup-node@v4.0.3
      - name: Setup Node.js
        uses: actions/setup-node@6012dfb466de543a19a3538f5e09e41c0ad3cf09
        with:
          node-version: '20'
          cache: 'pnpm'

      # actions/setup-java@v4.2.1
      - name: Setup JDK 17
        uses: actions/setup-java@3a4f611cd72b75a7fcd4e29002d242447d1b2299
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build frontend apps
        run: pnpm --filter apps/web --filter apps/mobile run build
